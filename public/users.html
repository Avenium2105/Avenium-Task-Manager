<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Avenium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F3EE; --bg-raised: #FBFBF8; --ink: #22261F; --ink-soft: #63685C; --ink-faint: #9A9C8F;
    --line: #E2E1D5; --line-soft: #EAE9DE; --pine: #3C5A46; --pine-soft: #E4ECE4;
    --ochre: #C68A2E; --ochre-soft: #F5E8D2; --brick: #B24A3C; --brick-soft: #F5E1DC;
    --shadow: 0 1px 2px rgba(34,38,31,0.06); --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1B1D18; --bg-raised: #232620; --ink: #ECEBE3; --ink-soft: #A9AB9C; --ink-faint: #74766A;
      --line: #34372E; --line-soft: #2B2D26; --pine: #7FAF8E; --pine-soft: #253227;
      --ochre: #E0AC57; --ochre-soft: #33291A; --brick: #E08A79; --brick-soft: #382320;
      --shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.5; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 20px 100px; }

  .topbar { display: flex; align-items: center; gap: 14px; font-size: 12.5px; color: var(--ink-soft); padding: 4px 0 0; }
  .topbar a, .topbar button.link { color: var(--ink-soft); text-decoration: none; background: none; border: none; font-family: inherit; font-size: 12.5px; cursor: pointer; padding: 0; }
  .topbar a:hover, .topbar button.link:hover { color: var(--pine); }
  .topbar .dot { color: var(--line); }

  .brand-mark { display: inline-flex; align-items: center; margin: 26px 0 18px; }
  .brand-logo { height: 22px; width: auto; display: block; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 30px; margin: 0 0 24px; letter-spacing: -0.01em; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }

  table { width: 100%; border-collapse: collapse; background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  th, td { text-align: left; padding: 10px 12px; font-size: 13.5px; border-top: 1px solid var(--line-soft); }
  th { color: var(--ink-soft); font-weight: 500; font-size: 12px; border-top: none; }
  tr:first-child td { border-top: none; }
  .role-badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; background: var(--pine-soft); color: var(--pine); }
  .role-badge.member { background: var(--line-soft); color: var(--ink-soft); }
  .row-actions { display: flex; gap: 10px; }
  .row-actions button { font-family: inherit; font-size: 12.5px; color: var(--ink-soft); background: none; border: none; cursor: pointer; padding: 0; }
  .row-actions button:hover { color: var(--pine); }
  .row-actions button.danger:hover { color: var(--brick); }

  .edit-panel { display: none; background: var(--bg); border-top: 1px solid var(--line-soft); padding: 12px; }
  .edit-panel.open { display: block; }
  .edit-panel .fields { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .edit-panel input, .edit-panel select {
    font-family: inherit; font-size: 12.5px; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--bg-raised); color: var(--ink); outline: none;
  }
  .edit-panel button { font-family: inherit; font-size: 12.5px; font-weight: 500; padding: 6px 12px; border: none; border-radius: 6px; background: var(--pine); color: var(--bg-raised); cursor: pointer; }
  .edit-panel .msg { font-size: 12px; color: var(--brick); margin-top: 8px; }
  .edit-panel .msg.ok { color: var(--pine); }

  .add-user-row { margin-top: 14px; }
  .add-user-btn { font-family: inherit; font-size: 13px; font-weight: 500; color: var(--pine); background: none; border: 1px dashed var(--line); border-radius: var(--radius); padding: 9px 16px; cursor: pointer; }
  .add-user-btn:hover { border-color: var(--pine); background: var(--pine-soft); }

  .add-form { background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-top: 14px; }
  .add-form .fields { display: flex; gap: 8px; flex-wrap: wrap; }
  .add-form input, .add-form select {
    font-family: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 7px; background: var(--bg); color: var(--ink); outline: none; flex: 1; min-width: 120px;
  }
  .add-form button { font-family: inherit; font-size: 13px; font-weight: 500; padding: 8px 16px; border: none; border-radius: 7px; background: var(--pine); color: var(--bg-raised); cursor: pointer; }
  .add-form button.cancel { background: none; color: var(--ink-soft); font-weight: 400; }
  .add-form .msg { font-size: 12.5px; margin-top: 10px; color: var(--brick); }
  .add-form .msg.ok { color: var(--pine); }

  .activity-toggle { margin-top: 40px; }
  .activity-toggle button { font-family: inherit; font-size: 12.5px; color: var(--ink-faint); background: none; border: none; cursor: pointer; padding: 0; }
  .activity-toggle button:hover { color: var(--pine); }
  .activity-list { display: none; list-style: none; margin: 10px 0 0; padding: 0; background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .activity-list li { padding: 10px 14px; border-top: 1px solid var(--line-soft); font-size: 13px; display: flex; justify-content: space-between; gap: 16px; }
  .activity-list li:first-child { border-top: none; }
  .activity-list .when { color: var(--ink-faint); font-size: 12px; white-space: nowrap; }
  .empty { color: var(--ink-faint); font-size: 13px; padding: 14px; }
  .status-badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; background: var(--ochre-soft); color: var(--ochre); }
  .status-badge.active { background: var(--pine-soft); color: var(--pine); }
  .invite-link-box { font-size: 11.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin-top: 8px; word-break: break-all; color: var(--ink-soft); }
</style>
</head>

  <h1>Admin</h1>

  <h2>Manage users</h2>
  <table id="usersTable">
    <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
    <tbody id="usersBody"></tbody>
  </table>

  <div class="add-user-row">
    <button id="showAddUserBtn" class="add-user-btn" type="button">+ Add user</button>
  </div>
  <div class="add-form" id="addForm" style="display:none;">
    <div class="fields">
      <input id="newEmail" placeholder="Email (required)" type="email" autocomplete="off">
      <select id="newRole">
        <option value="member">Member</option>
        <option value="admin">Admin</option>
      </select>
      <button id="addUserBtn" type="button">Send invite</button>
      <button id="cancelAddBtn" class="cancel" type="button">Cancel</button>
    </div>
    <div class="msg" id="addMsg"></div>
    <div class="invite-link-box" id="inviteLinkBox" style="display:none;"></div>
  </div>

  <div class="activity-toggle">
    <button id="activityToggleBtn" type="button">Show recent activity</button>
  </div>
  <ul class="activity-list" id="activityList"></ul>
</div>

<script>
  function relTime(iso) {
    if (!iso) return "";
    var diff = Date.now() - new Date(iso).getTime();
    var mins = Math.round(diff / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + (mins === 1 ? " minute ago" : " minutes ago");
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
    var days = Math.round(hrs / 24);
    if (days < 30) return days + (days === 1 ? " day ago" : " days ago");
    return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  var currentUserId = null;

  function el(tag, cls, attrs) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (attrs) for (var k in attrs) { if (k === "text") e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
    return e;
  }

  function loadUsers() {
    fetch("/api/me").then(function (r) { return r.json(); }).then(function (d) {
      currentUserId = d.user.id;
      return fetch("/api/users");
    }).then(function (r) { return r.json(); }).then(function (d) {
      renderUsers(d.users);
    });
  }

  function renderUsers(users) {
    var body = document.getElementById("usersBody");
    body.innerHTML = "";
    users.forEach(function (u) {
      var tr = el("tr");
      var nameTd = el("td");
      nameTd.innerHTML = "<strong>" + escapeHtml(u.displayName || "(pending)") + "</strong><br><span style='color:var(--ink-faint);font-size:12px;'>" + escapeHtml(u.username || "—") + "</span>";
      tr.appendChild(nameTd);

      tr.appendChild(el("td", "", { text: u.email || "—" }));

      var roleTd = el("td");
      roleTd.appendChild(el("span", "role-badge" + (u.role === "member" ? " member" : ""), { text: u.role === "admin" ? "Admin" : "Member" }));
      tr.appendChild(roleTd);

      var statusTd = el("td");
      statusTd.appendChild(el("span", "status-badge" + (u.status === "active" ? " active" : ""), { text: u.status === "active" ? "Active" : "Pending" }));
      tr.appendChild(statusTd);

      var actionsTd = el("td");
      var actions = el("div", "row-actions");
      var editBtn = el("button", "", { type: "button", text: "Edit" });
      actions.appendChild(editBtn);

      if (u.status === "pending") {
        var resendBtn = el("button", "", { type: "button", text: "Resend invite" });
        resendBtn.addEventListener("click", function () { resendInvite(u.id); });
        actions.appendChild(resendBtn);
      } else if (u.id === currentUserId) {
        var changePwBtn = el("button", "", { type: "button", text: "Change password" });
        actions.appendChild(changePwBtn);
      } else {
        var resetBtn = el("button", "", { type: "button", text: "Reset password" });
        resetBtn.addEventListener("click", function () { resetPassword(u.id); });
        actions.appendChild(resetBtn);
      }

      if (u.id !== currentUserId) {
        var delBtn = el("button", "danger", { type: "button", text: "Remove" });
        delBtn.addEventListener("click", function () { removeUser(u.id, u.username || u.email); });
        actions.appendChild(delBtn);
      }
      actionsTd.appendChild(actions);
      tr.appendChild(actionsTd);

      var panelRow = el("tr");
      var panelTd = el("td", "", { colspan: "5" });
      panelTd.style.padding = "0";
      var panel = el("div", "edit-panel");
      var fields = el("div", "fields");
      var nameInput = el("input", "", { type: "text", placeholder: "Display name" });
      nameInput.value = u.displayName || "";
      fields.appendChild(nameInput);

      var emailInput = el("input", "", { type: "email", placeholder: "Email" });
      emailInput.value = u.email || "";
      fields.appendChild(emailInput);

      var roleSel = el("select");
      roleSel.innerHTML = '<option value="member">Member</option><option value="admin">Admin</option>';
      roleSel.value = u.role;
      fields.appendChild(roleSel);

      var saveBtn = el("button", "", { type: "button", text: "Save" });
      fields.appendChild(saveBtn);
      panel.appendChild(fields);
      var panelMsg = el("div", "msg");
      panel.appendChild(panelMsg);
      panelTd.appendChild(panel);
      panelRow.appendChild(panelTd);

      editBtn.addEventListener("click", function () { panel.classList.toggle("open"); });
      saveBtn.addEventListener("click", function () {
        var name = nameInput.value.trim();
        var email = emailInput.value.trim();
        if (!name) { panelMsg.textContent = "Display name is required."; return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { panelMsg.textContent = "A valid email is required."; return; }
        var body = { displayName: name, email: email, role: roleSel.value };
        fetch("/api/users/" + u.id, {
          method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
          .then(function (res) {
            if (res.ok) { loadUsers(); }
            else {
              panelMsg.textContent = res.data.error === "last_admin" ? "Can't remove admin rights from the only admin."
                : res.data.error === "invalid_email" ? "That email doesn't look valid."
                : "Couldn't save changes.";
            }
          });
      });

      body.appendChild(tr);
      body.appendChild(panelRow);

      if (u.id === currentUserId) {
        var pwPanelRow = el("tr");
        var pwPanelTd = el("td", "", { colspan: "5" });
        pwPanelTd.style.padding = "0";
        var pwPanel = el("div", "edit-panel");
        var pwFields = el("div", "fields");
        var pwCurrentInput = el("input", "", { type: "password", placeholder: "Current password", autocomplete: "current-password" });
        pwFields.appendChild(pwCurrentInput);
        var pwNewInput = el("input", "", { type: "password", placeholder: "New password (6+ characters)", autocomplete: "new-password" });
        pwFields.appendChild(pwNewInput);
        var pwSaveBtn = el("button", "", { type: "button", text: "Update" });
        pwFields.appendChild(pwSaveBtn);
        pwPanel.appendChild(pwFields);
        var pwPanelMsg = el("div", "msg");
        pwPanel.appendChild(pwPanelMsg);
        pwPanelTd.appendChild(pwPanel);
        pwPanelRow.appendChild(pwPanelTd);

        changePwBtn.addEventListener("click", function () { pwPanel.classList.toggle("open"); });
        pwSaveBtn.addEventListener("click", function () {
          var current = pwCurrentInput.value;
          var next = pwNewInput.value;
          fetch("/api/change-password", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ currentPassword: current, newPassword: next })
          }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
            .then(function (res) {
              if (res.ok) { pwPanelMsg.className = "msg ok"; pwPanelMsg.textContent = "Password updated."; pwCurrentInput.value = ""; pwNewInput.value = ""; }
              else {
                pwPanelMsg.className = "msg";
                pwPanelMsg.textContent = res.data.error === "wrong_current_password" ? "Current password is wrong."
                  : res.data.error === "weak_password" ? "New password needs 6+ characters."
                  : "Couldn't update password.";
              }
            });
        });

        body.appendChild(pwPanelRow);
      }
    });
  }

  function resendInvite(id) {
    fetch("/api/users/" + id + "/resend-invite", { method: "POST" }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.ok) {
        var box = document.getElementById("inviteLinkBox");
        box.style.display = "block";
        box.textContent = d.emailed ? "Invite re-sent." : "Couldn't email it — share this link directly: " + d.inviteLink;
      }
    });
  }

  function resetPassword(id) {
    if (!window.confirm("Send a password reset link to this person's email?")) return;
    fetch("/api/users/" + id + "/reset-password", { method: "POST" }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.ok) {
        var box = document.getElementById("inviteLinkBox");
        box.style.display = "block";
        box.textContent = d.emailed ? "Reset link emailed to them." : "Couldn't email it — share this link directly: " + d.inviteLink;
      }
    });
  }

  function removeUser(id, username) {
    if (!window.confirm("Remove the account \"" + username + "\"? They won't be able to sign in anymore.")) return;
    fetch("/api/users/" + id, { method: "DELETE" }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
      .then(function (res) {
        if (res.ok) loadUsers();
        else window.alert(res.data.error === "last_admin" ? "Can't remove the only admin account." : "Couldn't remove that account.");
      });
  }

  document.getElementById("addUserBtn").addEventListener("click", function () {
    var msg = document.getElementById("addMsg");
    msg.className = "msg";
    var linkBox = document.getElementById("inviteLinkBox");
    linkBox.style.display = "none";
    var body = {
      email: document.getElementById("newEmail").value.trim(),
      role: document.getElementById("newRole").value
    };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(body.email)) { msg.textContent = "A valid email is required."; return; }
    fetch("/api/users", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }).catch(function () { return { ok: false, data: { error: "bad_response", status: r.status } }; }); })
      .then(function (res) {
        if (res.ok) {
          msg.textContent = res.data.emailed ? ("Invited " + body.email + " — they'll get an email to set up their account.") : ("Invited " + body.email + ", but the email couldn't be sent — share the link below with them.");
          msg.className = "msg ok";
          if (!res.data.emailed) { linkBox.style.display = "block"; linkBox.textContent = res.data.inviteLink; }
          document.getElementById("newEmail").value = "";
          loadUsers();
        } else {
          msg.textContent = res.data.error === "email_taken" ? "That email is already in use."
            : res.data.error === "invalid_email" ? "That email doesn't look valid."
            : res.data.error === "forbidden" ? "Your session isn't recognized as admin — try logging out and back in."
            : res.data.error === "not_authenticated" ? "You've been signed out — log in again."
            : "Couldn't send that invite (server said: " + (res.data.error || ("HTTP " + (res.data.status || "unknown"))) + ").";
        }
      }).catch(function (e) {
        msg.textContent = "Couldn't reach the server: " + e.message;
      });
  });

  document.getElementById("showAddUserBtn").addEventListener("click", function () {
    document.getElementById("addForm").style.display = "block";
    document.getElementById("showAddUserBtn").style.display = "none";
    document.getElementById("newEmail").focus();
  });

  document.getElementById("cancelAddBtn").addEventListener("click", function () {
    document.getElementById("addForm").style.display = "none";
    document.getElementById("showAddUserBtn").style.display = "";
    document.getElementById("newEmail").value = "";
    document.getElementById("addMsg").textContent = "";
    document.getElementById("addMsg").className = "msg";
    document.getElementById("inviteLinkBox").style.display = "none";
  });

  document.getElementById("activityToggleBtn").addEventListener("click", function () {
    var list = document.getElementById("activityList");
    var isOpen = list.style.display === "block";
    list.style.display = isOpen ? "none" : "block";
    this.textContent = isOpen ? "Show recent activity" : "Hide recent activity";
  });

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function loadActivity() {
    fetch("/api/activity").then(function (r) { return r.json(); }).then(function (d) {
      var list = document.getElementById("activityList");
      list.innerHTML = "";
      if (!d.activity.length) { list.appendChild(el("li", "empty", { text: "No changes yet." })); return; }
      d.activity.forEach(function (a) {
        var li = el("li");
        li.appendChild(el("span", "", { text: a.text }));
        li.appendChild(el("span", "when", { text: relTime(a.at) }));
        list.appendChild(li);
      });
    });
  }

  document.getElementById("logoutBtn").addEventListener("click", function () {
    fetch("/api/logout", { method: "POST" }).then(function () { window.location.href = "/login.html"; });
  });

  loadUsers();
  loadActivity();
</script>
</body>
</html>
