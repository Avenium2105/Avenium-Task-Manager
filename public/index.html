<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avenium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/nav.css">
<style>
  :root {
    --bg: #F3F3EE; --bg-raised: #FBFBF8; --ink: #22261F; --ink-soft: #63685C; --ink-faint: #9A9C8F;
    --line: #E2E1D5; --line-soft: #EAE9DE; --pine: #3C5A46; --pine-soft: #E4ECE4;
    --ochre: #C68A2E; --ochre-soft: #F5E8D2; --slate: #4C7A9E; --slate-soft: #E1EAF1;
    --brick: #B24A3C; --brick-soft: #F5E1DC; --grey-pill: #E6E5DA; --grey-pill-ink: #6C6F62;
    --shadow: 0 1px 3px rgba(34,38,31,0.07); --radius: 12px;
  }
  /* Always light — intentionally ignores the device's dark-mode setting so the app looks the same on mobile as on desktop. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }

  /* Top nav bar rules now live in /nav.css, shared verbatim with users.html so the header can never drift between pages again. */

  .page { display: flex; align-items: flex-start; justify-content: center; gap: 28px; max-width: 1440px; margin: 0 auto; padding: 0 28px; }
  .wrap { max-width: 900px; flex: 1 1 auto; margin: 0; padding: 20px 0 100px; min-width: 0; }

  .board-chat { flex-shrink: 0; width: 400px; margin: 20px 0 0; background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); position: sticky; top: 20px; display: flex; flex-direction: column; max-height: calc(100vh - 40px); transition: width 0.15s; }
  .board-chat.task-mode { width: 560px; }
  .board-chat.all-mode { width: 620px; }
  .board-chat-head { padding: 14px 16px; border-bottom: 1px solid var(--line-soft); font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .board-chat-head .head-titles { display: flex; flex-direction: column; min-width: 0; }
  .board-chat-head .head-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-chat-head .sub { font-weight: 400; color: var(--ink-faint); font-size: 11.5px; display: block; margin-top: 2px; }
  .board-chat-body { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; min-height: 160px; }
  .board-chat-foot { padding: 12px 16px; border-top: 1px solid var(--line-soft); }
  .board-chat-foot .chat-input-row input { background: var(--bg); }
  .board-chat-placeholder { color: var(--ink-faint); font-size: 12.5px; font-style: italic; padding: 4px 0; }
  .board-chat-link-list { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .board-chat-link { text-align: left; font-family: inherit; font-size: 13px; color: var(--slate); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; cursor: pointer; }
  .board-chat-link:hover { background: var(--slate-soft); border-color: var(--slate); }
  .board-chat-link.active { background: var(--slate); color: var(--bg-raised); border-color: var(--slate); }

  .all-boards-split { display: flex; gap: 14px; flex: 1; min-height: 0; }
  .all-boards-links-col { flex: 0 0 140px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--line); padding-right: 14px; overflow-y: auto; min-height: 0; }
  .all-boards-chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .all-boards-chat-col .task-chat-messages { flex: 1; }

  @media (max-width: 1100px) {
    .page { display: block; padding: 0 20px; }
    .wrap { max-width: none; padding: 20px 0 40px; }
    .board-chat, .board-chat.task-mode, .board-chat.all-mode { width: auto; margin: 0 0 20px; position: static; max-height: none; }
    .task-panel-cols { grid-template-columns: 1fr; }
    .all-boards-split { flex-direction: column; }
    .all-boards-links-col { flex: 0 0 auto; flex-direction: row; flex-wrap: wrap; border-right: none; padding-right: 0; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  }

  .board-access-wrap { display: inline-flex; }
  .board-access-popover { background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgba(34,38,31,0.15); padding: 10px; min-width: 220px; }
  .board-access-popover label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 5px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
  .board-access-popover label:hover { background: var(--line-soft); }
  .board-access-popover hr { border: none; border-top: 1px solid var(--line-soft); margin: 6px 0; }
  .board-access-title { font-size: 12.5px; font-weight: 600; color: var(--ink); padding: 2px 6px 6px; }
  .board-access-close { float: right; font-size: 15px; line-height: 1; color: var(--ink-faint); background: none; border: none; cursor: pointer; padding: 2px 4px; }
  .board-access-close:hover { color: var(--ink); }

  .board-menu-btn { font-family: inherit; font-size: 15px; color: var(--ink-faint); background: none; border: none; cursor: pointer; padding: 6px 8px; border-radius: 6px; line-height: 1; }
  .board-menu-btn:hover { color: var(--pine); background: var(--bg-raised); }
  .board-menu { background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgba(34,38,31,0.15); padding: 4px; min-width: 160px; }
  .board-menu button { display: block; width: 100%; text-align: left; font-family: inherit; font-size: 13px; color: var(--ink); background: none; border: none; padding: 9px 11px; border-radius: 5px; cursor: pointer; }
  .board-menu button:hover { background: var(--line-soft); }


  header.board-head { margin: 22px 0 20px; }
  .board-head h1 { font-family: "Fraunces", Georgia, serif; font-optical-sizing: auto; font-weight: 500; font-size: 32px; letter-spacing: -0.01em; margin: 0 0 4px; color: var(--ink); }
  .board-head .date-line { color: var(--ink-soft); font-size: 14px; margin: 0; }
  .board-head .quote-line { color: var(--ink-faint); font-size: 13px; font-style: italic; margin: 6px 0 0; }

  /* board tabs — a modern segmented control instead of underlined text tabs */
  .board-tabs { display: flex; align-items: flex-end; gap: 3px; flex-wrap: wrap; margin: 0; background: var(--line-soft); border-bottom: 2px solid var(--line); padding: 10px 32px 0; }
  .board-tab-wrap { display: inline-flex; align-items: center; border-radius: 9px 9px 0 0; cursor: grab; position: relative; }
  .board-tab-wrap:active { cursor: grabbing; }
  .board-tab-wrap.drag-over { box-shadow: inset 0 0 0 2px var(--slate); }
  .board-tab {
    font-family: inherit; font-size: 13px; font-weight: 700; color: var(--ink-soft); background: var(--line-soft); border: 1px solid var(--line); border-bottom: none;
    padding: 9px 18px; cursor: pointer; border-radius: 9px 9px 0 0; transition: background 0.15s, color 0.15s; margin-bottom: -2px;
  }
  .board-tab:hover { color: var(--ink); }
  .board-tab.active { color: var(--pine); background: var(--bg-raised); border-color: var(--line); box-shadow: 0 -1px 4px rgba(34,38,31,0.06); position: relative; z-index: 2; }
  .board-tab.add-board { color: var(--ink-faint); font-weight: 700; background: transparent; border-color: transparent; }
  .board-tab.add-board:hover { color: var(--pine); background: var(--bg-raised); }
  .board-tab-rename { font-family: inherit; font-size: 14px; color: var(--ink-faint); background: none; border: none; cursor: pointer; padding: 6px 6px; border-radius: 6px; }
  .board-tab-rename:hover { color: var(--pine); background: var(--bg-raised); }
  .board-tab-delete { font-family: inherit; font-size: 14px; color: var(--ink-faint); background: none; border: none; cursor: pointer; padding: 6px 6px; border-radius: 6px; }
  .board-tab-delete:hover { color: var(--brick); background: var(--bg-raised); }
  .board-section { margin-bottom: 30px; border-radius: 8px; transition: background 0.1s; }
  .board-section.drag-over { background: var(--slate-soft); }
  .board-section-head { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .board-section-title { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 19px; color: var(--ink); letter-spacing: -0.01em; }
  .board-section-drag-handle { flex-shrink: 0; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); cursor: grab; border-radius: 6px; }
  .board-section-drag-handle:hover { background: var(--line-soft); color: var(--ink); }
  .board-section-drag-handle:active { cursor: grabbing; }

  .group { margin-bottom: 20px; background: var(--bg-raised); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(34,38,31,0.05), 0 1px 8px rgba(34,38,31,0.04); transition: box-shadow 0.15s, background 0.1s; }
  .group:hover { box-shadow: 0 2px 4px rgba(34,38,31,0.06), 0 4px 14px rgba(34,38,31,0.06); }
  .group.drag-over { background: var(--slate-soft); }
  .group-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 14px 0; cursor: pointer; user-select: none; border-left: 4px solid var(--accent, var(--pine)); }
  .group-drag-handle { flex-shrink: 0; width: 30px; height: 30px; margin-left: 6px; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); cursor: grab; border-radius: 6px; }
  .group-drag-handle:hover { background: var(--line-soft); color: var(--ink); }
  .group-drag-handle:active { cursor: grabbing; }
  .group-head .chevron { width: 14px; height: 14px; margin-left: 4px; flex-shrink: 0; color: var(--ink-faint); transition: transform 0.18s ease; }
  .group.collapsed .group-head .chevron { transform: rotate(-90deg); }
  .group-name { font-weight: 600; font-size: 15px; color: var(--ink); background: transparent; border: none; outline: none; padding: 3px 2px; border-radius: 5px; flex: 1; min-width: 0; font-family: inherit; }
  .group-name:hover, .group-name:focus { background: var(--line-soft); }
  .lock-icon { flex-shrink: 0; color: var(--ink-faint); display: flex; align-items: center; }
  .group-del { flex-shrink: 0; width: 32px; height: 32px; border: none; background: transparent; color: var(--ink-faint); cursor: pointer; border-radius: 7px; display: flex; align-items: center; justify-content: center; }
  .group-del svg { width: 15px; height: 15px; }
  .group-del:hover { background: var(--brick-soft); color: var(--brick); }
  .group-body { display: block; }
  .group.collapsed .group-body { display: none; }

  .item { display: flex; flex-direction: column; padding: 10px 16px 9px 20px; border-top: 1px solid var(--line-soft); transition: background 0.1s; cursor: pointer; }
  .item:hover { background: var(--line-soft); }
  .item.selected { background: var(--slate-soft); }
  .item.drag-over { background: var(--ochre-soft); }
  .item-main { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
  .item-meta { font-size: 12px; color: var(--ink-faint); }
  .item-notes { font-size: 12.5px; color: var(--ink-soft); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 6px 0 0 30px; width: calc(100% - 30px); font-family: inherit; resize: vertical; min-height: 30px; outline: none; }

  .item-collapse-btn { flex-shrink: 0; width: 22px; height: 22px; border: none; background: transparent; color: var(--ink-faint); cursor: pointer; border-radius: 5px; display: flex; align-items: center; justify-content: center; padding: 0; transition: transform 0.15s; }
  .item-collapse-btn svg { width: 12px; height: 12px; }
  .item-collapse-btn:hover { background: var(--bg); color: var(--ink); }
  .item.item-collapsed .item-collapse-btn { transform: rotate(-90deg); }

  .item-title { flex: 1; min-width: 60px; background: transparent; border: none; outline: none; color: var(--ink); font-size: 14px; padding: 3px 4px; border-radius: 5px; font-family: inherit; cursor: text; }
  .item-title:hover, .item-title:focus { background: var(--bg); }
  .item.is-done .item-title { color: var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--ink-faint); }

  .priority-tag { flex-shrink: 0; font-size: 11.5px; font-weight: 500; padding: 3px 9px; border-radius: 20px; border: none; cursor: pointer; background: var(--grey-pill); color: var(--grey-pill-ink); font-family: inherit; white-space: nowrap; }
  .priority-tag.low { background: var(--pine-soft); color: var(--pine); }
  .priority-tag.high { background: var(--brick-soft); color: var(--brick); }
  .priority-tag.medium { background: var(--ochre-soft); color: var(--ochre); }

  .assignee-chips { display: flex; align-items: center; flex-shrink: 0; }
  .assignee-avatar { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; font-size: 10.5px; font-weight: 700; color: #fff; border: 2px solid var(--bg-raised); margin-left: -8px; }
  .assignee-avatar:first-child { margin-left: 0; }
  .assignee-picker-btn { flex-shrink: 0; font-size: 11.5px; font-family: inherit; color: var(--grey-pill-ink); background: var(--grey-pill); border: none; border-radius: 20px; padding: 3px 8px; cursor: pointer; white-space: nowrap; }
  .assignee-picker-btn:hover { background: var(--line-soft); }
  .assignee-popover-list { background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgba(34,38,31,0.15); padding: 6px; min-width: 170px; max-height: 220px; overflow-y: auto; }
  .assignee-popover-list label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 5px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
  .assignee-popover-list label:hover { background: var(--line-soft); }

  .notify-btn, .item-del { flex-shrink: 0; width: 32px; height: 32px; border: none; background: transparent; color: var(--ink-faint); cursor: pointer; border-radius: 7px; display: flex; align-items: center; justify-content: center; }
  .notify-btn svg, .item-del svg { width: 15px; height: 15px; }
  .notify-btn:hover { background: var(--slate-soft); color: var(--slate); }
  .notify-btn.sent { color: var(--pine); }
  .details-btn { flex-shrink: 0; font-family: inherit; font-size: 12px; font-weight: 500; color: var(--ink-soft); background: var(--line-soft); border: none; border-radius: 20px; padding: 5px 11px; cursor: pointer; white-space: nowrap; }
  .details-btn:hover { color: var(--ink); background: var(--line); }
  .details-btn.active { color: var(--bg-raised); background: var(--slate); }
  .item-del { opacity: 0; transition: opacity 0.15s; }
  .item:hover .item-del, .item.selected .item-del { opacity: 1; }
  .item-del:hover { background: var(--brick-soft); color: var(--brick); }

  .step-checklist { display: flex; flex-direction: column; gap: 6px; padding: 6px 0 4px 30px; width: calc(100% - 30px); }
  .step-row { display: flex; align-items: center; gap: 8px; }
  .step-text { flex: 1; font-size: 14px; color: var(--ink-soft); background: transparent; border: none; outline: none; font-family: inherit; padding: 6px 6px; border-radius: 6px; min-width: 0; }
  .step-text:hover, .step-text:focus { background: var(--bg); color: var(--ink); }
  .step-row.done .step-text { color: var(--ink-faint); text-decoration: line-through; }
  .step-row-update-btn { flex-shrink: 0; font-family: inherit; font-size: 12px; font-weight: 500; color: var(--bg-raised); background: var(--slate); border: none; border-radius: 20px; padding: 6px 13px; cursor: pointer; white-space: nowrap; }
  .step-row-update-btn:hover { background: var(--pine); }

  .step-completed-toggle { align-self: flex-start; font-family: inherit; font-size: 12.5px; color: var(--ink-faint); background: none; border: none; cursor: pointer; padding: 4px; }
  .step-completed-toggle:hover { color: var(--pine); }

  .step-add-link { align-self: flex-start; font-family: inherit; font-size: 13px; color: var(--ink-faint); background: none; border: none; cursor: pointer; padding: 4px; }
  .step-add-link:hover { color: var(--pine); }

  .floating-popover { position: fixed; z-index: 1000; }
  .step-menu { background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgba(34,38,31,0.15); padding: 4px; min-width: 170px; }
  .step-menu button { display: block; width: 100%; text-align: left; font-family: inherit; font-size: 13px; color: var(--ink); background: none; border: none; padding: 9px 11px; border-radius: 5px; cursor: pointer; }
  .step-menu button:hover:not(:disabled) { background: var(--line-soft); }
  .step-menu button:disabled { color: var(--ink-faint); cursor: default; }
  .step-menu button.danger:hover { background: var(--brick-soft); color: var(--brick); }

  .step-add-row { display: flex; gap: 6px; padding: 2px 0; }
  .step-add-row input { flex: 1; font-family: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); outline: none; }
  .step-add-row button { font-family: inherit; font-size: 13px; font-weight: 500; padding: 8px 14px; border: none; border-radius: 7px; background: var(--pine); color: var(--bg-raised); cursor: pointer; white-space: nowrap; }
  .step-add-row button.cancel { background: none; color: var(--ink-soft); }

  .task-panel-body { display: flex; flex-direction: column; gap: 10px; }
  .task-panel-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: stretch; }
  .task-panel-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .task-panel-col:first-child { border-right: 1px solid var(--line); padding-right: 18px; }
  .task-panel-chat-col { display: flex; flex-direction: column; min-height: 0; }
  .details-section-label { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); margin-bottom: 4px; }
  .details-notes { font-size: 13px; color: var(--ink-soft); background: var(--bg-raised); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; width: 100%; font-family: inherit; resize: vertical; min-height: 220px; outline: none; line-height: 1.5; }

  .file-list { display: flex; flex-direction: column; gap: 4px; }
  .file-row { display: flex; align-items: center; gap: 6px; font-size: 12.5px; background: var(--bg-raised); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .file-row a { color: var(--slate); text-decoration: none; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-row a:hover { text-decoration: underline; }
  .file-row .file-size { color: var(--ink-faint); font-size: 11px; white-space: nowrap; }
  .file-row .file-del { flex-shrink: 0; width: 28px; height: 28px; border: none; background: none; color: var(--ink-faint); cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .file-row .file-del svg { width: 13px; height: 13px; }
  .file-row .file-del:hover { color: var(--brick); background: var(--brick-soft); }
  .file-drop { border: 1.5px dashed var(--line); border-radius: 6px; padding: 10px; text-align: center; font-size: 12px; color: var(--ink-faint); cursor: pointer; }
  .file-drop:hover, .file-drop.drag-over { border-color: var(--pine); color: var(--pine); background: var(--pine-soft); }
  .file-drop input[type=file] { display: none; }

  /* WhatsApp-style chat bubbles: own messages right-aligned/green, others left-aligned/white */
  .task-chat-messages { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 120px; max-height: 420px; overflow-y: auto; padding: 4px 2px; }
  .chat-row { display: flex; position: relative; }
  .chat-row.mine { justify-content: flex-end; }
  .chat-bubble { max-width: 78%; background: var(--bg-raised); border: 1px solid var(--line); border-radius: 12px 12px 12px 3px; padding: 7px 10px; cursor: pointer; }
  .chat-row.mine .chat-bubble { background: var(--pine-soft); border-color: var(--pine-soft); border-radius: 12px 12px 3px 12px; }
  .chat-who { font-size: 11px; font-weight: 600; color: var(--slate); margin-bottom: 2px; }
  .chat-text { font-size: 13px; color: var(--ink); line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
  .chat-when { font-size: 10px; color: var(--ink-faint); margin-top: 3px; text-align: right; }
  .chat-empty { color: var(--ink-faint); font-size: 12px; font-style: italic; }
  .chat-input-row { display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: nowrap; margin-top: 8px; }
  .chat-input-row input { flex: 1 1 auto; min-width: 0; font-family: inherit; font-size: 13px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 20px; background: var(--bg-raised); color: var(--ink); outline: none; }
  .chat-input-row button { flex-shrink: 0; font-family: inherit; font-size: 12px; font-weight: 500; padding: 8px 15px; border: none; border-radius: 20px; background: var(--slate); color: var(--bg-raised); cursor: pointer; }

  .read-receipt-popover { background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgba(34,38,31,0.15); padding: 8px 10px; min-width: 170px; font-size: 12px; }
  .read-receipt-title { font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .read-receipt-line { display: flex; justify-content: space-between; gap: 10px; color: var(--ink-soft); padding: 2px 0; }
  .read-receipt-time { color: var(--ink-faint); white-space: nowrap; }
  .read-receipt-empty { color: var(--ink-faint); font-style: italic; }
  .read-receipt-actions { display: flex; gap: 6px; }
  .read-receipt-actions button { flex: 1; font-family: inherit; font-size: 12px; font-weight: 500; padding: 6px 8px; border: none; border-radius: 6px; background: var(--line-soft); color: var(--ink); cursor: pointer; }
  .read-receipt-actions button.danger { background: var(--brick-soft); color: var(--brick); }
  .chat-edited { color: var(--ink-faint); font-size: 10px; font-style: italic; }
  .chat-edit-form { display: flex; gap: 4px; }
  .chat-edit-form input { flex: 1; font-family: inherit; font-size: 12.5px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; outline: none; min-width: 0; }
  .chat-edit-form button { font-family: inherit; font-size: 11px; font-weight: 500; padding: 4px 7px; border: none; border-radius: 5px; background: var(--pine); color: var(--bg-raised); cursor: pointer; }
  .chat-edit-form button.cancel { background: none; color: var(--ink-soft); }

  .chat-to-btn { flex-shrink: 0; font-family: inherit; font-size: 12px; font-weight: 500; color: var(--ink-soft); background: var(--line-soft); border: none; border-radius: 20px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  .chat-to-btn.chosen { color: var(--slate); background: var(--slate-soft); }
  .chat-to-btn:hover { background: var(--slate); color: var(--bg-raised); }
  .recipient-popover { background: var(--bg-raised); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgba(34,38,31,0.15); padding: 8px 10px; min-width: 190px; max-height: 260px; overflow-y: auto; }
  .recipient-popover label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 5px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
  .recipient-popover label:hover { background: var(--line-soft); }
  .recipient-popover hr { border: none; border-top: 1px solid var(--line-soft); margin: 4px 0; }

  .archived-toggle-row { text-align: center; margin: 10px 0 4px; }
  .archived-toggle-row button { font-family: inherit; font-size: 12.5px; color: var(--ink-faint); background: none; border: none; cursor: pointer; }
  .archived-toggle-row button:hover { color: var(--pine); }
  .archived-section { opacity: 0.75; }
  .archived-section .group-head { border-left-color: var(--ink-faint) !important; }

  .add-row { display: flex; align-items: center; gap: 9px; padding: 10px 14px 12px 18px; border-top: 1px solid var(--line-soft); }
  .add-row .plus { width: 20px; height: 20px; flex-shrink: 0; color: var(--ink-faint); display: flex; align-items: center; justify-content: center; }
  .add-input { flex: 1; border: none; background: transparent; outline: none; font-size: 14px; color: var(--ink); padding: 4px 2px; font-family: inherit; }
  .add-input::placeholder { color: var(--ink-faint); }

  .add-group-btn { display: flex; align-items: center; gap: 8px; background: transparent; border: 1px dashed var(--line); color: var(--ink-soft); font-family: inherit; font-size: 13.5px; padding: 12px 16px; border-radius: var(--radius); cursor: pointer; width: 100%; transition: border-color 0.15s, color 0.15s, background 0.15s; }
  .add-group-btn:hover { border-color: var(--ink-faint); color: var(--ink); background: var(--bg-raised); }

  .new-group-form { background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow); flex-wrap: wrap; }
  .new-group-form input[type=text] { flex: 1; min-width: 140px; border: none; background: var(--bg); border-radius: 6px; padding: 7px 10px; font-size: 14px; color: var(--ink); outline: none; font-family: inherit; }
  .new-group-form label { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; }
  .new-group-form button { border: none; background: var(--pine); color: var(--bg-raised); font-family: inherit; font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: 6px; cursor: pointer; }
  .new-group-form button.cancel { background: transparent; color: var(--ink-soft); }

  .foot-note { text-align: center; color: var(--ink-faint); font-size: 12px; margin-top: 30px; }

  @media (max-width: 480px) {
    .wrap { padding: 14px 14px 90px; }
    .board-head h1 { font-size: 27px; }
    .priority-tag, .status-label { display: none; }
  }
  ::selection { background: var(--pine-soft); }
</style>
</head>
<body>
<div class="topnav" id="topnav"></div>
<script src="/nav.js"></script>
<div class="board-tabs" id="boardTabs"></div>
<div class="page">
<div class="wrap">
  <main id="groupsMount"></main>
  <div id="addGroupMount"></div>
</div>

<aside class="board-chat" id="boardChat" style="display:none;">
  <div class="board-chat-head" id="boardChatHead"></div>
  <div class="board-chat-body" id="boardChatBody"></div>
  <div class="board-chat-foot" id="boardChatFoot"></div>
</aside>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function () {
  "use strict";

  var state = { boards: [], groups: [], items: [], messages: [] };
  var team = [];
  var currentUser = null;
  var selectedBoardId = localStorage.getItem("daily-board-selected-board") || "__all__";
  var allBoardsChatBoardId = null; // which board's chat is previewed in the right-hand column while on "All boards"
  var collapsedKey = "daily-board-collapsed";
  var notifiedRecently = {};
  var showArchived = false;
  var openStepAdders = {};   // itemId -> true while its "add a step" input is showing
  var openStepMenus = {};    // itemId -> true while its Step menu (Next/Completed step/Completed task) is open
  var openStepRowMenus = {}; // stepId -> true while that step's own \u22ee menu is open
  var openCompletedSteps = {}; // itemId -> true while its completed-steps list is expanded
  var openAssigneePickers = {}; // itemId -> true while its assignee picker is open
  var openBoardAccess = {}; // boardId -> true while its access popover is open
  var openBoardMenus = {}; // boardId -> true while its 3-dot options menu is open
  var collapsedItems = {}; // itemId -> true while collapsed to title-only
  var dragState = { type: null, id: null }; // in-progress native drag (group / item / board-section / board-tab)
  var openMessagePopovers = {}; // messageId -> true while its "read by" popover is open
  var openNewBoardForm = false; // true while the "+ new board" popover form is showing
  var messageRecipients = {}; // "board:id" / "item:id" -> { all: bool, ids: [] } — who a new message goes to
  var openMessageEdits = {}; // messageId -> true while inline-editing that message
  var selectedItemId = null; // when set, the right-side panel shows this task's notes/files/chat instead of board chat

  function getCollapsed() { try { var raw = localStorage.getItem(collapsedKey); return raw ? JSON.parse(raw) : {}; } catch (e) { return {}; } }
  function setCollapsed(map) { try { localStorage.setItem(collapsedKey, JSON.stringify(map)); } catch (e) {} }

  function fmtDate(now) { return now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }); }
  function greetingWord(now) { var h = now.getHours(); if (h < 12) return "Good morning"; if (h < 18) return "Good afternoon"; return "Good evening"; }
  function relTime(iso) {
    if (!iso) return "";
    var diff = Date.now() - new Date(iso).getTime();
    var mins = Math.round(diff / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + (mins === 1 ? " minute ago" : " minutes ago");
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
    var days = Math.round(hrs / 24);
    if (days < 30) return days + (days === 1 ? " day ago" : " days ago");
    return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function el(tag, cls, attrs) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (attrs) for (var k in attrs) { if (k === "text") e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
    return e;
  }
  function checkSvg() { return '<svg viewBox="0 0 12 12" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5L4.8 9L10 3"/></svg>'; }
  function arrowSvg() { return '<svg viewBox="0 0 12 12" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6H9.5M6.5 3L9.5 6L6.5 9"/></svg>'; }
  function dotSvg() { return '<svg viewBox="0 0 12 12" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.6"/></svg>'; }
  function chevronSvg() { return '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5L7 8.5L10 5.5"/></svg>'; }
  function xSvg() { return '<svg viewBox="0 0 14 14" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 3.5L10.5 10.5M10.5 3.5L3.5 10.5"/></svg>'; }
  function plusSvg() { return '<svg viewBox="0 0 14 14" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M7 2.5V11.5M2.5 7H11.5"/></svg>'; }
  function lockSvg() { return '<svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="8" height="6" rx="1"/><path d="M4.5 6.5V4.5a2.5 2.5 0 0 1 5 0v2"/></svg>'; }
  function bellSvg() { return '<svg viewBox="0 0 14 14" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a4 4 0 0 1 8 0c0 2 .6 3 1 3.5H2c.4-.5 1-1.5 1-3.5Z"/><path d="M5.5 11a1.5 1.5 0 0 0 3 0"/></svg>'; }
  function noteSvg() { return '<svg viewBox="0 0 14 14" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2.5h8v9l-2.5 2-2.5-2-3 2v-11Z"/><path d="M5 5.5h4M5 8h4"/></svg>'; }

  function sendSvg() { return '<svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7L12 2.5L8 12L6.3 7.7L2 7Z"/></svg>'; }
  function clipSvg() { return '<svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5L4.8 8.2a2 2 0 0 0 2.8 2.8l4.2-4.2a3.2 3.2 0 0 0-4.5-4.5L3.1 6.5a4.3 4.3 0 0 0 6 6"/></svg>'; }

  function fmtBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return Math.round(n / 1024) + " KB";
    return (n / (1024 * 1024)).toFixed(1) + " MB";
  }

  // ---- generic native drag-and-drop: dragging one row onto another swaps
  // their order. Used for groups, tasks, board sections, and board tabs.
  // Note: this is desktop mouse-drag only (HTML5 drag-and-drop isn't
  // triggered by touch), so touch/mobile users won't be able to drag.
  function makeDragSource(handleEl, type, id) {
    handleEl.draggable = true;
    handleEl.addEventListener("dragstart", function (e) {
      e.stopPropagation();
      dragState = { type: type, id: id };
      if (e.dataTransfer) { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", id); }
    });
    handleEl.addEventListener("dragend", function () { dragState = { type: null, id: null }; });
  }
  function makeDropTarget(targetEl, type, id, onSwap) {
    targetEl.addEventListener("dragover", function (e) {
      if (dragState.type === type && dragState.id && dragState.id !== id) {
        e.preventDefault();
        targetEl.classList.add("drag-over");
      }
    });
    targetEl.addEventListener("dragleave", function () { targetEl.classList.remove("drag-over"); });
    targetEl.addEventListener("drop", function (e) {
      targetEl.classList.remove("drag-over");
      if (dragState.type === type && dragState.id && dragState.id !== id) {
        e.preventDefault();
        onSwap(dragState.id, id);
      }
      dragState = { type: null, id: null };
    });
  }

  // Anchors a dropdown/popover to document.body with position:fixed, computed
  // from the trigger element's live position. This makes it immune to any
  // ancestor's `overflow: hidden` clipping it — the previous approach (plain
  // CSS position:absolute inside the row/card) kept getting cut off by
  // whichever card happened to contain it.
  //
  // Positioning is deferred to a microtask: anchorPopover is usually called
  // while the row/card that holds the trigger button is still being built
  // as a detached tree (before it's appended into the live document), so
  // measuring the trigger's position synchronously here would read (0,0)
  // and the popover would land pinned to the top-left corner of the page.
  // Waiting a tick lets the calling render() pass finish attaching that
  // tree first. The popover stays invisible in the meantime so there's no
  // visible flash at the wrong spot.
  function anchorPopover(triggerEl, contentEl, align) {
    document.body.appendChild(contentEl);
    contentEl.classList.add("floating-popover");
    contentEl.style.visibility = "hidden";
    Promise.resolve().then(function () {
      var r = triggerEl.getBoundingClientRect();
      contentEl.style.top = (r.bottom + 4) + "px";
      if (align === "right") {
        contentEl.style.left = "";
        contentEl.style.right = (window.innerWidth - r.right) + "px";
      } else {
        contentEl.style.left = r.left + "px";
      }
      // after it's sized, nudge back on-screen if it overflows the viewport
      var cr = contentEl.getBoundingClientRect();
      if (cr.right > window.innerWidth - 8) contentEl.style.left = Math.max(8, window.innerWidth - cr.width - 8) + "px";
      if (cr.bottom > window.innerHeight - 8) contentEl.style.top = Math.max(8, r.top - cr.height - 4) + "px";
      contentEl.style.visibility = "";
    });
  }

  var AVATAR_COLORS = ["#C68A2E", "#4C7A9E", "#7D6BAE", "#B24A3C", "#3C5A46", "#B5860B", "#5E7CE2", "#9C4F96"];
  function initialsFor(name) {
    var parts = String(name || "?").trim().split(/\s+/);
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  function colorForUser(id) {
    var hash = 0;
    var s = String(id || "");
    for (var i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[hash % AVATAR_COLORS.length];
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }

  // Renders @mentions inside chat text as bold, matching the same names the
  // server looks for when it decides who to notify.
  function renderMentionText(text) {
    var html = escapeHtml(text);
    team.forEach(function (t) {
      [t.displayName].filter(Boolean).forEach(function (h) {
        var re = new RegExp("@" + h.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "gi");
        html = html.replace(re, function (m) { return "<strong>" + m + "</strong>"; });
      });
    });
    return html;
  }

  // ---------------- render ----------------

  function boardsToShow() { return state.boards.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); }); }
  function boardsInTabOrder() { return state.boards.slice().sort(function (a, b) { return (a.tabOrder || 0) - (b.tabOrder || 0); }); }

  function renderTabs() {
    var mount = document.getElementById("boardTabs");
    mount.innerHTML = "";
    var allTab = el("button", "board-tab" + (selectedBoardId === "__all__" ? " active" : ""), { type: "button", text: "All boards" });
    allTab.addEventListener("click", function () { selectedBoardId = "__all__"; localStorage.setItem("daily-board-selected-board", selectedBoardId); render(); });
    mount.appendChild(allTab);

    var isAdmin = currentUser && currentUser.role === "admin";
    boardsInTabOrder().forEach(function (b) {
      var wrap = el("span", "board-tab-wrap", { title: "Drag to reorder tabs" });
      makeDragSource(wrap, "board-tab", b.id);
      makeDropTarget(wrap, "board-tab", b.id, function (srcId, targetId) { socket.emit("swapBoardTabOrder", { idA: srcId, idB: targetId }); });
      var tab = el("button", "board-tab" + (selectedBoardId === b.id ? " active" : ""), { type: "button", text: b.name });
      tab.addEventListener("click", function () { selectedBoardId = b.id; localStorage.setItem("daily-board-selected-board", selectedBoardId); render(); });
      wrap.appendChild(tab);
      if (isAdmin) {
        var isEmpty = !state.groups.some(function (g) { return g.boardId === b.id; });
        if (isEmpty && boardsToShow().length > 1) {
          var deleteBtn = el("button", "board-tab-delete", { type: "button", text: "✕", title: "Delete empty board" });
          deleteBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            if (window.confirm("Delete the empty board \"" + b.name + "\"? This can't be undone.")) {
              socket.emit("deleteBoard", { id: b.id });
            }
          });
          wrap.appendChild(deleteBtn);
        }

        var menuWrap2 = el("span", "board-menu-wrap");
        var dotsBtn = el("button", "board-menu-btn", { type: "button", text: "\u22ee", title: "Board options" });
        dotsBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          openBoardMenus[b.id] = !openBoardMenus[b.id];
          render();
        });
        menuWrap2.appendChild(dotsBtn);
        if (openBoardMenus[b.id]) {
          var boardMenu = el("div", "board-menu");
          boardMenu.addEventListener("click", function (e) { e.stopPropagation(); });

          var usersBtn = el("button", "", { type: "button", text: "Users" });
          usersBtn.addEventListener("click", function () {
            delete openBoardMenus[b.id];
            openBoardAccess[b.id] = true;
            render();
          });
          boardMenu.appendChild(usersBtn);

          var editNameBtn = el("button", "", { type: "button", text: "Edit name" });
          editNameBtn.addEventListener("click", function () {
            delete openBoardMenus[b.id];
            var name = window.prompt("Rename this board:", b.name);
            if (name && name.trim() && name.trim() !== b.name) socket.emit("updateBoard", { id: b.id, name: name.trim() });
          });
          boardMenu.appendChild(editNameBtn);

          var archivedBtn = el("button", "", { type: "button", text: showArchived ? "Hide archived" : "Show archived" });
          archivedBtn.addEventListener("click", function () {
            delete openBoardMenus[b.id];
            showArchived = !showArchived;
            render();
          });
          boardMenu.appendChild(archivedBtn);

          menuWrap2.appendChild(boardMenu);
        }
        wrap.appendChild(menuWrap2);
        if (openBoardMenus[b.id]) anchorPopover(dotsBtn, boardMenu, "left");

        var accessWrap = el("span", "board-access-wrap");
        if (openBoardAccess[b.id]) {
          var pop = el("div", "board-access-popover");
          pop.addEventListener("click", function (e) { e.stopPropagation(); });
          var closeAccess = el("button", "board-access-close", { type: "button", text: "\u00d7", "aria-label": "Close" });
          closeAccess.addEventListener("click", function () { delete openBoardAccess[b.id]; render(); });
          pop.appendChild(closeAccess);
          pop.appendChild(el("div", "board-access-title", { text: "Who can see \u201c" + b.name + "\u201d" }));
          var openEveryone = !b.memberIds;
          var openLabel = el("label");
          var openCheck = el("input", "", { type: "checkbox" });
          openCheck.checked = openEveryone;
          openLabel.appendChild(openCheck);
          openLabel.appendChild(document.createTextNode("Open to everyone"));
          pop.appendChild(openLabel);
          pop.appendChild(el("hr"));
          var memberChecks = [];
          team.forEach(function (t) {
            var lbl = el("label");
            var chk = el("input", "", { type: "checkbox" });
            chk.checked = openEveryone || (b.memberIds || []).includes(t.id);
            chk.disabled = openEveryone;
            chk.dataset.uid = t.id;
            memberChecks.push(chk);
            lbl.appendChild(chk);
            lbl.appendChild(document.createTextNode(t.displayName));
            pop.appendChild(lbl);
          });
          pop.appendChild(el("hr"));
          var privateLbl = el("label");
          var privateChk = el("input", "", { type: "checkbox" });
          privateChk.checked = !!b.private;
          privateChk.disabled = openEveryone;
          privateLbl.appendChild(privateChk);
          privateLbl.appendChild(document.createTextNode("Private (hides this board's chat, and only selected people can see it exists)"));
          pop.appendChild(privateLbl);
          function commitAccess() {
            if (openCheck.checked) {
              socket.emit("updateBoardAccess", { id: b.id, memberIds: null });
            } else {
              var ids = memberChecks.filter(function (c) { return c.checked; }).map(function (c) { return c.dataset.uid; });
              socket.emit("updateBoardAccess", { id: b.id, memberIds: ids, isPrivate: privateChk.checked });
            }
          }
          openCheck.addEventListener("change", function () {
            memberChecks.forEach(function (c) { c.disabled = openCheck.checked; });
            privateChk.disabled = openCheck.checked;
            commitAccess();
          });
          memberChecks.forEach(function (c) { c.addEventListener("change", commitAccess); });
          privateChk.addEventListener("change", commitAccess);
        }
        wrap.appendChild(accessWrap);
        if (openBoardAccess[b.id]) anchorPopover(menuWrap2, pop, "left");
      }
      mount.appendChild(wrap);
    });

    var addWrap = el("span", "board-tab-wrap");
    var addTab = el("button", "board-tab add-board", { type: "button", text: "+", title: "New board" });
    addTab.addEventListener("click", function (e) {
      e.stopPropagation();
      openNewBoardForm = !openNewBoardForm;
      render();
    });
    addWrap.appendChild(addTab);
    if (openNewBoardForm) {
      var newBoardPop = el("div", "board-access-popover");
      newBoardPop.addEventListener("click", function (e) { e.stopPropagation(); });
      var nameInput2 = el("input", "", { type: "text", placeholder: "Board name (e.g. a client)" });
      nameInput2.style.width = "100%";
      nameInput2.style.marginBottom = "8px";
      newBoardPop.appendChild(nameInput2);
      var privLbl = el("label");
      var privChk = el("input", "", { type: "checkbox" });
      privLbl.appendChild(privChk);
      privLbl.appendChild(document.createTextNode("Private (no one else can see this board, or that you created it)"));
      newBoardPop.appendChild(privLbl);
      var createBtn = el("button", "add-group-btn", { type: "button", text: "Create board" });
      createBtn.style.marginTop = "8px";
      createBtn.addEventListener("click", function () {
        var name = nameInput2.value.trim();
        if (name) {
          socket.emit("addBoard", { name: name, isPrivate: privChk.checked });
          openNewBoardForm = false;
          render();
        }
      });
      newBoardPop.appendChild(createBtn);
      anchorPopover(addTab, newBoardPop, "left");
      setTimeout(function () { nameInput2.focus(); }, 0);
    }
    mount.appendChild(addWrap);
  }

  function render() {
    // Floating popovers (anchorPopover) are appended straight to document.body,
    // outside anything render() normally clears — remove any leftovers from the
    // previous render before rebuilding, or they pile up and get "stuck" on screen.
    document.querySelectorAll(".floating-popover").forEach(function (n) { n.remove(); });

    var now = new Date();
    renderTabs();

    var showingAll = selectedBoardId === "__all__";
    var visibleGroups = state.groups.filter(function (g) { return showingAll || g.boardId === selectedBoardId; });
    var visibleGroupIds = {};
    visibleGroups.forEach(function (g) { visibleGroupIds[g.id] = true; });
    var visibleItems = state.items.filter(function (i) { return visibleGroupIds[i.groupId]; });

    renderSidePanel(showingAll ? null : boardsToShow().find(function (b) { return b.id === selectedBoardId; }));

    var collapsed = getCollapsed();
    var mount = document.getElementById("groupsMount");
    mount.innerHTML = "";

    var sortedGroups = visibleGroups.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });

    function renderGroupSection(g, reorderList, gIndex) {
      var allGroupItems = state.items.filter(function (i) { return i.groupId === g.id; }).sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      var groupItems = showArchived ? allGroupItems : allGroupItems.filter(function (i) { return !i.archived; });
      var isCollapsed = !!collapsed[g.id];

      var groupEl = el("section", "group" + (isCollapsed ? " collapsed" : ""));
      groupEl.style.setProperty("--accent", g.color || "#3C5A46");

      var head = el("div", "group-head");

      var dragHandle = el("span", "group-drag-handle", { title: "Drag to reorder" });
      dragHandle.innerHTML = '<svg viewBox="0 0 14 14" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h10M2 7h10M2 10h10"/></svg>';
      dragHandle.addEventListener("click", function (e) { e.stopPropagation(); });
      makeDragSource(dragHandle, "group", g.id);
      head.appendChild(dragHandle);
      makeDropTarget(groupEl, "group", g.id, function (srcId, targetId) { socket.emit("swapGroupOrder", { idA: srcId, idB: targetId }); });

      var chev = el("div", "chevron"); chev.innerHTML = chevronSvg(); head.appendChild(chev);

      if (g.visibility === "private") {
        var lock = el("span", "lock-icon"); lock.innerHTML = lockSvg(); lock.title = "Private — only visible to you"; head.appendChild(lock);
      }

      var nameInput = el("input", "group-name");
      nameInput.value = g.name || "";
      if (g.updatedBy) nameInput.title = "Renamed by " + g.updatedBy + " \u00b7 " + relTime(g.updatedAt);
      else if (g.createdBy) nameInput.title = "Added by " + g.createdBy;
      nameInput.addEventListener("click", function (e) { e.stopPropagation(); });
      nameInput.addEventListener("change", function () { updateGroup(g.id, { name: nameInput.value.trim() || "Untitled" }); });
      head.appendChild(nameInput);

      if (!allGroupItems.length) {
        var delBtn = el("button", "group-del", { "aria-label": "Delete group", type: "button" });
        delBtn.innerHTML = xSvg();
        delBtn.addEventListener("click", function (e) { e.stopPropagation(); deleteGroup(g.id); });
        head.appendChild(delBtn);
      }

      head.addEventListener("click", function () { var c = getCollapsed(); c[g.id] = !c[g.id]; setCollapsed(c); render(); });
      groupEl.appendChild(head);

      var body = el("div", "group-body");
      groupItems.forEach(function (item) { body.appendChild(renderItem(item)); });

      var addRow = el("form", "add-row");
      var plus = el("div", "plus"); plus.innerHTML = plusSvg(); addRow.appendChild(plus);
      var addInput = el("input", "add-input", { placeholder: "Add a task", type: "text", enterkeyhint: "done" });
      addRow.appendChild(addInput);
      addRow.addEventListener("submit", function (e) {
        e.preventDefault();
        if (addInput.value.trim()) { addItem(g.id, addInput.value.trim(), groupItems.length); addInput.value = ""; addInput.focus(); }
      });
      body.appendChild(addRow);

      groupEl.appendChild(body);
      return groupEl;
    }

    if (showingAll) {
      var boardsInOrder = boardsToShow();
      boardsInOrder.forEach(function (b, bIndex) {
        var boardGroups = sortedGroups.filter(function (g) { return g.boardId === b.id; });
        if (!boardGroups.length) return;

        var section = el("div", "board-section");
        var sHead = el("div", "board-section-head");

        var sHandle = el("span", "board-section-drag-handle", { title: "Drag to reorder" });
        sHandle.innerHTML = '<svg viewBox="0 0 14 14" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h10M2 7h10M2 10h10"/></svg>';
        makeDragSource(sHandle, "board-section", b.id);
        sHead.appendChild(sHandle);
        makeDropTarget(section, "board-section", b.id, function (srcId, targetId) { socket.emit("swapBoardOrder", { idA: srcId, idB: targetId }); });

        sHead.appendChild(el("span", "board-section-title", { text: b.name }));
        section.appendChild(sHead);

        boardGroups.forEach(function (g, gIndex) { section.appendChild(renderGroupSection(g, boardGroups, gIndex)); });
        mount.appendChild(section);
      });
    } else {
      sortedGroups.forEach(function (g, gIndex) { mount.appendChild(renderGroupSection(g, sortedGroups, gIndex)); });
    }

    var addMount = document.getElementById("addGroupMount");
    if (!addMount.dataset.formOpen) {
      addMount.innerHTML = "";
      if (!showingAll) {
        var addGroupBtn = el("button", "add-group-btn", { type: "button" });
        var pl = el("span"); pl.innerHTML = plusSvg();
        addGroupBtn.appendChild(pl);
        addGroupBtn.appendChild(document.createTextNode("Add group"));
        addGroupBtn.addEventListener("click", function () { addMount.dataset.formOpen = "1"; renderAddGroupForm(); });
        addMount.appendChild(addGroupBtn);
      }
    }
  }

  function renderAddGroupForm() {
    var addMount = document.getElementById("addGroupMount");
    addMount.innerHTML = "";
    var form = el("form", "new-group-form");
    var input = el("input", "", { placeholder: "Group name", type: "text", enterkeyhint: "done" });
    form.appendChild(input);
    var privLabel = el("label");
    var privCheck = el("input", "", { type: "checkbox" });
    privLabel.appendChild(privCheck);
    privLabel.appendChild(document.createTextNode("Private (only visible to you)"));
    form.appendChild(privLabel);
    var saveBtn = el("button", "", { type: "submit", text: "Add" });
    form.appendChild(saveBtn);
    var cancelBtn = el("button", "cancel", { type: "button", text: "Cancel" });
    cancelBtn.addEventListener("click", function () { delete addMount.dataset.formOpen; render(); });
    form.appendChild(cancelBtn);
    addMount.appendChild(form);
    input.focus();
    form.addEventListener("submit", function (e) { e.preventDefault(); commit(); });
    input.addEventListener("keydown", function (e) { if (e.key === "Escape") { delete addMount.dataset.formOpen; render(); } });
    function commit() {
      var name = input.value.trim();
      if (!name) { delete addMount.dataset.formOpen; render(); return; }
      socket.emit("addGroup", { name: name, boardId: selectedBoardId, visibility: privCheck.checked ? "private" : "shared" });
      delete addMount.dataset.formOpen;
    }
  }

  function renderItem(item) {
    var isCollapsed = !!collapsedItems[item.id];
    var row = el("div", "item" + (item.archived ? " is-done" : "") + (item.id === selectedItemId ? " selected" : "") + (isCollapsed ? " item-collapsed" : ""));
    var main = el("div", "item-main");

    var collapseBtn = el("button", "item-collapse-btn", { type: "button", "aria-label": isCollapsed ? "Expand task" : "Collapse task", title: "Click to collapse \u00b7 drag to reorder" });
    collapseBtn.innerHTML = chevronSvg();
    collapseBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      collapsedItems[item.id] = !isCollapsed;
      render();
    });
    makeDragSource(collapseBtn, "item", item.id);
    makeDropTarget(row, "item", item.id, function (srcId, targetId) { socket.emit("swapItemOrder", { idA: srcId, idB: targetId }); });
    main.appendChild(collapseBtn);

    var titleInput = el("input", "item-title");
    titleInput.value = item.title || "";
    titleInput.addEventListener("change", function () { updateItem(item.id, { title: titleInput.value.trim() || "Untitled task" }); });
    main.appendChild(titleInput);

    var detailsBtn = el("button", "details-btn" + (item.id === selectedItemId ? " active" : ""), { type: "button", text: "Details", title: "Notes, files, and chat for this task" });
    detailsBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      selectedItemId = (selectedItemId === item.id) ? null : item.id;
      render();
    });
    main.appendChild(detailsBtn);

    // ---- multi-assignee picker ----
    var assigneeIds = item.assigneeIds || [];
    var pickerWrap = el("span", "assignee-popover");
    var assigneeTrigger;
    if (assigneeIds.length) {
      var chips = el("span", "assignee-chips");
      assigneeIds.forEach(function (aid) {
        var t = team.find(function (x) { return x.id === aid; });
        var name = t ? t.displayName : "?";
        var avatar = el("span", "assignee-avatar", { title: name, text: initialsFor(name) });
        avatar.style.background = colorForUser(aid);
        chips.appendChild(avatar);
      });
      chips.addEventListener("click", function (e) { e.stopPropagation(); openAssigneePickers[item.id] = !openAssigneePickers[item.id]; render(); });
      chips.style.cursor = "pointer";
      pickerWrap.appendChild(chips);
      assigneeTrigger = chips;
    } else {
      var pickBtn = el("button", "assignee-picker-btn", { type: "button", text: "Unassigned" });
      pickBtn.addEventListener("click", function (e) { e.stopPropagation(); openAssigneePickers[item.id] = !openAssigneePickers[item.id]; render(); });
      pickerWrap.appendChild(pickBtn);
      assigneeTrigger = pickBtn;
    }
    if (openAssigneePickers[item.id]) {
      var list = el("div", "assignee-popover-list");
      list.addEventListener("click", function (e) { e.stopPropagation(); });
      team.forEach(function (t) {
        var lbl = el("label");
        var chk = el("input", "", { type: "checkbox" });
        chk.checked = assigneeIds.includes(t.id);
        chk.addEventListener("change", function () {
          var next = chk.checked ? assigneeIds.concat([t.id]) : assigneeIds.filter(function (x) { return x !== t.id; });
          updateItem(item.id, { assigneeIds: next });
        });
        lbl.appendChild(chk);
        lbl.appendChild(document.createTextNode(t.displayName));
        list.appendChild(lbl);
      });
      anchorPopover(assigneeTrigger, list, "left");
    }
    main.appendChild(pickerWrap);

    var priorityLabels = { low: "Low", medium: "Medium", high: "High" };
    var priBtn = el("button", "priority-tag " + (item.priority || ""), { type: "button", text: priorityLabels[item.priority] || "Priority" });
    priBtn.addEventListener("click", function () {
      var next = item.priority === "low" ? "medium" : item.priority === "medium" ? "high" : "low";
      updateItem(item.id, { priority: next });
    });
    main.appendChild(priBtn);

    var notifyBtn = el("button", "notify-btn" + (notifiedRecently[item.id] ? " sent" : ""), { type: "button", "aria-label": "Notify assignees", title: assigneeIds.length ? "Notify it's their turn" : "Assign someone first" });
    notifyBtn.innerHTML = bellSvg();
    if (!assigneeIds.length) notifyBtn.disabled = true;
    notifyBtn.addEventListener("click", function () {
      socket.emit("notifyTurn", { itemId: item.id });
      notifiedRecently[item.id] = true;
      notifyBtn.classList.add("sent");
      setTimeout(function () { notifiedRecently[item.id] = false; }, 4000);
    });
    main.appendChild(notifyBtn);

    var canDeleteItem = currentUser && (currentUser.role === "admin" || !item.createdById || item.createdById === currentUser.id);
    if (canDeleteItem) {
      var delBtn = el("button", "item-del", { type: "button", "aria-label": "Delete task" });
      delBtn.innerHTML = xSvg();
      delBtn.addEventListener("click", function () { deleteItem(item.id); });
      main.appendChild(delBtn);
    }

    row.appendChild(main);

    if (!isCollapsed) {
      // ---- persistent step checklist: any number of steps, each independently
      // completable, with a "+" to add more at any time ----
      row.appendChild(renderStepChecklist(item));
    }

    // Clicking anywhere on the task (that isn't one of its interactive controls)
    // opens this task's notes/files/chat in the right-side panel.
    row.addEventListener("click", function (e) {
      if (e.target.closest("input, button, textarea, a")) return;
      selectedItemId = (selectedItemId === item.id) ? null : item.id;
      render();
    });

    return row;
  }

  function renderStepChecklist(item) {
    var wrap = el("div", "step-checklist");
    var steps = item.steps || [];
    var openSteps = steps.filter(function (s) { return !s.done; });
    var doneSteps = steps.filter(function (s) { return s.done; });

    function renderStepRow(s) {
      var stepRow = el("div", "step-row" + (s.done ? " done" : ""));

      var rowUpdateBtn = el("button", "step-row-update-btn", { type: "button", text: "Update" });
      rowUpdateBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        openStepRowMenus[s.id] = !openStepRowMenus[s.id];
        render();
      });
      stepRow.appendChild(rowUpdateBtn);

      var textInput = el("input", "step-text", { type: "text" });
      textInput.value = s.text || "";
      textInput.addEventListener("change", function () {
        if (textInput.value.trim() && textInput.value.trim() !== s.text) {
          socket.emit("updateTaskStep", { itemId: item.id, stepId: s.id, text: textInput.value.trim() });
        } else {
          textInput.value = s.text || "";
        }
      });
      stepRow.appendChild(textInput);

      if (openStepRowMenus[s.id]) {
        var rowMenu = el("div", "step-menu");
        rowMenu.addEventListener("click", function (e) { e.stopPropagation(); });
        if (!item.archived) {
          var completeTaskBtn2 = el("button", "danger", { type: "button", text: "Complete Task" });
          completeTaskBtn2.addEventListener("click", function () {
            delete openStepRowMenus[s.id];
            if (window.confirm("Mark \"" + item.title + "\" as fully complete? It will move to Archived.")) {
              socket.emit("completeTask", { itemId: item.id });
            }
            render();
          });
          rowMenu.appendChild(completeTaskBtn2);
        }
        var deleteStepBtn = el("button", "danger", { type: "button", text: "Delete Step" });
        deleteStepBtn.addEventListener("click", function () {
          delete openStepRowMenus[s.id];
          socket.emit("deleteTaskStep", { itemId: item.id, stepId: s.id });
          render();
        });
        rowMenu.appendChild(deleteStepBtn);
        var addStepBtn = el("button", "", { type: "button", text: "+ Add step" });
        addStepBtn.addEventListener("click", function () {
          delete openStepRowMenus[s.id];
          openStepAdders[item.id] = true;
          render();
        });
        rowMenu.appendChild(addStepBtn);
        var toggleDoneBtn = el("button", "", { type: "button", text: s.done ? "Mark not done" : "Mark done" });
        toggleDoneBtn.addEventListener("click", function () {
          delete openStepRowMenus[s.id];
          socket.emit("toggleTaskStep", { itemId: item.id, stepId: s.id, done: !s.done });
          if (!s.done) openStepAdders[item.id] = true; // marking a step done immediately opens the next line
          render();
        });
        rowMenu.appendChild(toggleDoneBtn);
        anchorPopover(rowUpdateBtn, rowMenu, "left");
      }

      return stepRow;
    }

    openSteps.forEach(function (s) { wrap.appendChild(renderStepRow(s)); });

    if (doneSteps.length) {
      if (openCompletedSteps[item.id]) {
        doneSteps.forEach(function (s) { wrap.appendChild(renderStepRow(s)); });
      }
      var toggleCompleted = el("button", "step-completed-toggle", { type: "button" });
      toggleCompleted.textContent = openCompletedSteps[item.id]
        ? "Hide completed steps"
        : doneSteps.length + " completed step" + (doneSteps.length === 1 ? "" : "s") + " \u2014 show";
      toggleCompleted.addEventListener("click", function () { openCompletedSteps[item.id] = !openCompletedSteps[item.id]; render(); });
      wrap.appendChild(toggleCompleted);
    }

    if (openStepAdders[item.id]) {
      var form = el("form", "step-add-row");
      var input = el("input", "", { type: "text", placeholder: "What's the next step?", enterkeyhint: "done" });
      form.appendChild(input);
      var saveBtn = el("button", "", { type: "submit", text: "Save" });
      form.appendChild(saveBtn);
      var cancelAddBtn = el("button", "cancel", { type: "button", text: "Cancel" });
      cancelAddBtn.addEventListener("click", function () { delete openStepAdders[item.id]; render(); });
      form.appendChild(cancelAddBtn);
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (input.value.trim()) { socket.emit("addTaskStep", { itemId: item.id, text: input.value.trim() }); delete openStepAdders[item.id]; render(); }
      });
      wrap.appendChild(form);
      setTimeout(function () { input.focus(); }, 0);
    } else {
      var addStepLink = el("button", "step-add-link", { type: "button", text: "+ Add step" });
      addStepLink.addEventListener("click", function () { openStepAdders[item.id] = true; render(); });
      wrap.appendChild(addStepLink);
    }

    return wrap;
  }

  function renderTaskPanelBody(item) {
    var wrap = el("div", "task-panel-body");

    if (item.updatedBy) {
      var everEdited = item.updatedBy !== item.createdBy;
      var label = everEdited ? "Updated by " + item.updatedBy : "Added by " + (item.createdBy || item.updatedBy);
      wrap.appendChild(el("div", "item-meta", { text: label + " \u00b7 " + relTime(item.updatedAt) }));
    }

    var cols = el("div", "task-panel-cols");

    var left = el("div", "task-panel-col");
    left.appendChild(el("div", "details-section-label", { text: "Notes" }));
    var ta = el("textarea", "details-notes", { placeholder: "Notes\u2026" });
    ta.value = item.notes || "";
    ta.addEventListener("blur", function () { updateItem(item.id, { notes: ta.value }); });
    left.appendChild(ta);

    left.appendChild(el("div", "details-section-label", { text: "Files" }));
    var fileList = el("div", "file-list");
    (item.files || []).forEach(function (f) {
      var row = el("div", "file-row");
      var link = el("a", "", { href: "/api/items/" + item.id + "/files/" + f.id, target: "_blank", text: f.name });
      row.appendChild(link);
      row.appendChild(el("span", "file-size", { text: fmtBytes(f.size) }));
      var delF = el("button", "file-del", { type: "button", "aria-label": "Remove file" });
      delF.innerHTML = xSvg();
      delF.addEventListener("click", function () {
        if (window.confirm("Remove \"" + f.name + "\"?")) {
          fetch("/api/items/" + item.id + "/files/" + f.id, { method: "DELETE" });
        }
      });
      row.appendChild(delF);
      fileList.appendChild(row);
    });
    left.appendChild(fileList);

    var drop = el("label", "file-drop", { text: "Click or drop a file to attach (up to 20MB)" });
    var fileInput = el("input", "", { type: "file" });
    fileInput.addEventListener("change", function () {
      if (fileInput.files[0]) uploadItemFile(item.id, fileInput.files[0]);
      fileInput.value = "";
    });
    drop.appendChild(fileInput);
    drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.classList.add("drag-over"); });
    drop.addEventListener("dragleave", function () { drop.classList.remove("drag-over"); });
    drop.addEventListener("drop", function (e) {
      e.preventDefault();
      drop.classList.remove("drag-over");
      if (e.dataTransfer.files[0]) uploadItemFile(item.id, e.dataTransfer.files[0]);
    });
    left.appendChild(drop);
    cols.appendChild(left);

    var right = el("div", "task-panel-col task-panel-chat-col");
    right.appendChild(el("div", "details-section-label", { text: "Chat" }));
    var chatMsgsWrap = el("div", "task-chat-messages");
    var chatMsgs = state.messages.filter(function (m) { return m.scope === "item" && m.scopeId === item.id; });
    if (!chatMsgs.length) {
      chatMsgsWrap.appendChild(el("div", "chat-empty", { text: "No messages yet." }));
    } else {
      chatMsgs.forEach(function (m) { chatMsgsWrap.appendChild(renderChatMsg(m)); });
    }
    right.appendChild(chatMsgsWrap);

    var chatForm = el("div", "chat-input-row task-chat-input");
    var compose = buildComposeControls("item", item.id, function () { return team; });
    chatForm.appendChild(compose.toBtn);
    chatForm.appendChild(compose.inputEl);
    var chatSend = el("button", "", { type: "button", text: "Send" });
    function sendTaskMsg() {
      if (compose.inputEl.value.trim() && !compose.inputEl.readOnly) {
        socket.emit("addMessage", { scope: "item", scopeId: item.id, text: compose.inputEl.value.trim(), mentionIds: compose.getMentionIds() });
        compose.inputEl.value = "";
      }
    }
    chatSend.addEventListener("click", sendTaskMsg);
    compose.inputEl.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); sendTaskMsg(); } });
    chatForm.appendChild(chatSend);
    right.appendChild(chatForm);

    cols.appendChild(right);
    wrap.appendChild(cols);

    socket.emit("markMessagesRead", { scope: "item", scopeId: item.id });
    setTimeout(function () { chatMsgsWrap.scrollTop = chatMsgsWrap.scrollHeight; }, 0);
    return wrap;
  }

  function renderChatMsg(m) {
    var isMine = currentUser && m.byId === currentUser.id;
    var canModify = isMine; // messages can only ever be edited/deleted by their own author — no admin override
    var row = el("div", "chat-row" + (isMine ? " mine" : ""));
    var bubble = el("div", "chat-bubble");
    if (!isMine) bubble.appendChild(el("div", "chat-who", { text: m.byName }));

    if (openMessageEdits[m.id]) {
      var editForm = el("form", "chat-edit-form");
      editForm.addEventListener("click", function (e) { e.stopPropagation(); });
      var editInput = el("input", "", { type: "text" });
      editInput.value = m.text;
      editForm.appendChild(editInput);
      var saveEditBtn = el("button", "", { type: "submit", text: "Save" });
      editForm.appendChild(saveEditBtn);
      var cancelEditBtn = el("button", "cancel", { type: "button", text: "Cancel" });
      cancelEditBtn.addEventListener("click", function () { delete openMessageEdits[m.id]; render(); });
      editForm.appendChild(cancelEditBtn);
      editForm.addEventListener("submit", function (e) {
        e.preventDefault();
        if (editInput.value.trim()) {
          socket.emit("updateMessage", { id: m.id, text: editInput.value.trim() });
          delete openMessageEdits[m.id];
          render();
        }
      });
      bubble.appendChild(editForm);
      setTimeout(function () { editInput.focus(); }, 0);
    } else {
      var textEl = el("div", "chat-text");
      textEl.innerHTML = renderMentionText(m.text) + (m.editedAt ? ' <span class="chat-edited">(edited)</span>' : "");
      bubble.appendChild(textEl);
      bubble.appendChild(el("div", "chat-when", { text: relTime(m.at) }));
      bubble.addEventListener("click", function (e) {
        e.stopPropagation();
        openMessagePopovers[m.id] = !openMessagePopovers[m.id];
        render();
      });
    }
    row.appendChild(bubble);

    if (openMessagePopovers[m.id]) {
      var readers = (m.readBy || []).filter(function (r) { return r.userId !== m.byId; });
      var pop = el("div", "read-receipt-popover");
      pop.addEventListener("click", function (e) { e.stopPropagation(); });
      if (!readers.length) {
        pop.appendChild(el("div", "read-receipt-empty", { text: "Not read by anyone else yet." }));
      } else {
        pop.appendChild(el("div", "read-receipt-title", { text: "Read by" }));
        readers.forEach(function (r) {
          var line = el("div", "read-receipt-line");
          line.appendChild(el("span", "", { text: r.userName }));
          line.appendChild(el("span", "read-receipt-time", { text: relTime(r.at) }));
          pop.appendChild(line);
        });
      }
      if (canModify) {
        pop.appendChild(el("hr"));
        var actions = el("div", "read-receipt-actions");
        var editBtn = el("button", "", { type: "button", text: "Edit" });
        editBtn.addEventListener("click", function () {
          delete openMessagePopovers[m.id];
          openMessageEdits[m.id] = true;
          render();
        });
        actions.appendChild(editBtn);
        var delMsgBtn = el("button", "danger", { type: "button", text: "Delete" });
        delMsgBtn.addEventListener("click", function () {
          if (window.confirm("Delete this message? This can't be undone.")) {
            socket.emit("deleteMessage", { id: m.id });
          }
        });
        actions.appendChild(delMsgBtn);
        pop.appendChild(actions);
      }
      anchorPopover(bubble, pop, isMine ? "right" : "left");
    }
    return row;
  }

  function uploadItemFile(itemId, file) {
    if (file.size > 20 * 1024 * 1024) { window.alert("That file is over the 20MB limit."); return; }
    var fd = new FormData();
    fd.append("file", file);
    fetch("/api/items/" + itemId + "/files", { method: "POST", body: fd })
      .then(function (r) { return r.json(); })
      .then(function (res) { if (!res.ok) window.alert("Couldn't upload that file."); })
      .catch(function () { window.alert("Couldn't reach the server."); });
  }

  // The right-side panel shows one of two things: the chat for the currently
  // selected board, or — once a task's notes icon is clicked — that task's
  // notes/files/chat. Selecting a task always takes over the panel; closing
  // it (the back button) returns to the board chat.
  function renderSidePanel(board) {
    var aside = document.getElementById("boardChat");
    aside.style.display = "flex";
    var head = document.getElementById("boardChatHead");
    var body = document.getElementById("boardChatBody");
    var foot = document.getElementById("boardChatFoot");

    var selectedItem = selectedItemId ? state.items.find(function (i) { return i.id === selectedItemId; }) : null;
    if (selectedItemId && !selectedItem) selectedItemId = null; // task no longer visible (deleted/filtered) — fall back

    if (selectedItem) {
      aside.classList.add("task-mode");
      aside.classList.remove("all-mode");
      foot.style.display = "none"; // task mode has its own input under the chat column instead
      head.innerHTML = "";
      head.appendChild(el("span", "head-title", { text: selectedItem.title }));
      // No explicit "back to board chat" button: the sidebar follows whatever
      // was last clicked (see the document-level click handler below), so
      // clicking elsewhere on the page returns here on its own.

      body.innerHTML = "";
      body.appendChild(renderTaskPanelBody(selectedItem));
      return;
    }

    foot.style.display = "";
    renderBoardChat(board);
  }

  function renderBoardChat(board) {
    var aside = document.getElementById("boardChat");
    aside.style.display = "flex";
    aside.classList.remove("task-mode");
    var head = document.getElementById("boardChatHead");
    var body = document.getElementById("boardChatBody");
    var foot = document.getElementById("boardChatFoot");
    foot.innerHTML = "";

    if (!board) {
      aside.classList.add("all-mode");
      foot.style.display = "none"; // compose lives inside the chat column, not the footer, in this two-column layout

      var chattableBoards = boardsToShow().filter(function (b) { return !b.private; });
      if (allBoardsChatBoardId && !chattableBoards.some(function (b) { return b.id === allBoardsChatBoardId; })) {
        allBoardsChatBoardId = null; // previewed board deleted or no longer visible — fall back
      }
      var previewBoard = allBoardsChatBoardId ? chattableBoards.find(function (b) { return b.id === allBoardsChatBoardId; }) : null;

      head.innerHTML = "";
      var headTitles = el("span", "head-titles");
      headTitles.appendChild(el("span", "head-title", { text: "Board chat" }));
      if (previewBoard) headTitles.appendChild(el("span", "sub", { text: previewBoard.name }));
      head.appendChild(headTitles);

      body.innerHTML = "";
      var split = el("div", "all-boards-split");

      var linksCol = el("div", "all-boards-links-col");
      chattableBoards.forEach(function (b) {
        var link = el("button", "board-chat-link" + (allBoardsChatBoardId === b.id ? " active" : ""), { type: "button", text: b.name });
        link.addEventListener("click", function () {
          allBoardsChatBoardId = b.id;
          renderSidePanel(null);
        });
        linksCol.appendChild(link);
      });
      split.appendChild(linksCol);

      var chatCol = el("div", "all-boards-chat-col");
      if (!previewBoard) {
        chatCol.appendChild(el("div", "board-chat-placeholder", { text: "Pick a board to see and send its chat." }));
      } else {
        var chatMsgsWrap = el("div", "task-chat-messages");
        var msgsAll = state.messages.filter(function (m) { return m.scope === "board" && m.scopeId === previewBoard.id; });
        if (!msgsAll.length) {
          chatMsgsWrap.appendChild(el("div", "chat-empty", { text: "No messages yet on this board." }));
        } else {
          msgsAll.forEach(function (m) { chatMsgsWrap.appendChild(renderChatMsg(m)); });
        }
        chatCol.appendChild(chatMsgsWrap);

        var composeAll = buildComposeControls("board", previewBoard.id, function () {
          return team.filter(function (t) { return !previewBoard.memberIds || previewBoard.memberIds.includes(t.id); });
        });
        var rowAll = el("div", "chat-input-row");
        rowAll.appendChild(composeAll.toBtn);
        rowAll.appendChild(composeAll.inputEl);
        var sendBtnAll = el("button", "", { type: "button", text: "Send" });
        function sendAll() {
          if (composeAll.inputEl.value.trim() && !composeAll.inputEl.readOnly) {
            socket.emit("addMessage", { scope: "board", scopeId: previewBoard.id, text: composeAll.inputEl.value.trim(), mentionIds: composeAll.getMentionIds() });
            composeAll.inputEl.value = "";
          }
        }
        sendBtnAll.addEventListener("click", sendAll);
        composeAll.inputEl.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); sendAll(); } });
        rowAll.appendChild(sendBtnAll);
        chatCol.appendChild(rowAll);

        socket.emit("markMessagesRead", { scope: "board", scopeId: previewBoard.id });
        setTimeout(function () { chatMsgsWrap.scrollTop = chatMsgsWrap.scrollHeight; }, 0);
      }
      split.appendChild(chatCol);
      body.appendChild(split);
      return;
    }

    aside.classList.remove("all-mode");
    foot.style.display = "";
    head.innerHTML = "";
    var headTitles = el("span", "head-titles");
    headTitles.appendChild(el("span", "head-title", { text: "Board chat" }));
    headTitles.appendChild(el("span", "sub", { text: board.name }));
    head.appendChild(headTitles);
    body.innerHTML = "";

    if (board.private) {
      body.appendChild(el("div", "board-chat-placeholder", { text: "Private boards don't have a chat." }));
      return;
    }

    var msgs = state.messages.filter(function (m) { return m.scope === "board" && m.scopeId === board.id; });
    if (!msgs.length) {
      body.appendChild(el("div", "chat-empty", { text: "No messages yet on this board." }));
    } else {
      msgs.forEach(function (m) { body.appendChild(renderChatMsg(m)); });
      body.scrollTop = body.scrollHeight;
    }

    var compose = buildComposeControls("board", board.id, function () {
      return team.filter(function (t) { return !board.memberIds || board.memberIds.includes(t.id); });
    });
    var row = el("div", "chat-input-row");
    row.appendChild(compose.toBtn);
    row.appendChild(compose.inputEl);
    var sendBtn = el("button", "", { type: "button", text: "Send" });
    function send() {
      if (compose.inputEl.value.trim() && !compose.inputEl.readOnly) {
        socket.emit("addMessage", { scope: "board", scopeId: board.id, text: compose.inputEl.value.trim(), mentionIds: compose.getMentionIds() });
        compose.inputEl.value = "";
      }
    }
    sendBtn.addEventListener("click", send);
    compose.inputEl.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); send(); } });
    row.appendChild(sendBtn);
    foot.appendChild(row);

    socket.emit("markMessagesRead", { scope: "board", scopeId: board.id });
  }

  // Recipient picker: replaces free-text "@name" mentions. Clicking the "To:"
  // control (or focusing the message input before anyone's been picked) opens
  // a checklist of everyone relevant to this chat, plus "All". The input stays
  // read-only until at least one recipient (or "All") is checked.
  function buildComposeControls(scopeType, scopeId, getRelevantUsers) {
    var key = scopeType + ":" + scopeId;
    if (!messageRecipients[key]) messageRecipients[key] = { all: false, ids: [] };
    var sel = messageRecipients[key];

    var toBtn = el("button", "chat-to-btn", { type: "button" });
