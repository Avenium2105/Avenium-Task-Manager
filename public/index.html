    var inputEl = el("input", "", { type: "text", enterkeyhint: "send" });

    function refresh() {
      toBtn.textContent = "Recipients";
      toBtn.classList.toggle("chosen", !!(sel.all || sel.ids.length));
      inputEl.readOnly = !(sel.all || sel.ids.length);
    }
    refresh();

    function openPicker() {
      document.querySelectorAll(".floating-popover").forEach(function (n) { n.remove(); }); // never stack duplicates
      var pop = el("div", "recipient-popover");
      pop.addEventListener("click", function (e) { e.stopPropagation(); });
      var allLbl = el("label");
      var allChk = el("input", "", { type: "checkbox" });
      allChk.checked = sel.all;
      allLbl.appendChild(allChk);
      allLbl.appendChild(document.createTextNode("All"));
      pop.appendChild(allLbl);
      pop.appendChild(el("hr"));
      var users = getRelevantUsers();
      var userChecks = [];
      users.forEach(function (u) {
        var lbl = el("label");
        var chk = el("input", "", { type: "checkbox" });
        chk.checked = sel.all || sel.ids.includes(u.id);
        chk.disabled = sel.all;
        chk.dataset.uid = u.id;
        userChecks.push(chk);
        lbl.appendChild(chk);
        lbl.appendChild(document.createTextNode(u.displayName));
        pop.appendChild(lbl);
      });
      function commit() {
        sel.all = allChk.checked;
        sel.ids = sel.all ? [] : userChecks.filter(function (c) { return c.checked; }).map(function (c) { return c.dataset.uid; });
        refresh();
        if (sel.all || sel.ids.length) {
          // Close the picker the moment there's a valid selection, instead of leaving it
          // open until the person clicks elsewhere: the popover sits right over the input,
          // so leaving it open meant a click on the input actually landed on the popover
          // first (closing it) and only a second click reached the input to focus it.
          pop.remove();
          inputEl.focus();
        }
      }
      allChk.addEventListener("change", function () { userChecks.forEach(function (c) { c.disabled = allChk.checked; }); commit(); });
      userChecks.forEach(function (c) { c.addEventListener("change", commit); });
      anchorPopover(toBtn, pop, "left");
    }
    toBtn.addEventListener("click", function (e) { e.stopPropagation(); openPicker(); });
    inputEl.addEventListener("focus", function () { if (inputEl.readOnly) openPicker(); });

    return {
      toBtn: toBtn,
      inputEl: inputEl,
      getMentionIds: function () { return sel.all ? [] : sel.ids.slice(); }
    };
  }

  // ---------------- auth / topbar wiring ----------------

  function applyMe(user) {
    currentUser = user;
    if (window.AveniumNav) window.AveniumNav.setAdmin(user.role === "admin"); // shared nav bar (nav.js) owns the Admin link/logout button
    render();
  }

  fetch("/api/me").then(function (r) {
    if (r.status === 401) { window.location.href = "/login.html"; return null; }
    return r.json();
  }).then(function (data) { if (data && data.user) applyMe(data.user); }).catch(function () {});

  // ---------------- socket wiring ----------------

  var socket = io();

  socket.on("auth_error", function () { window.location.href = "/login.html"; });
  socket.on("me", function (user) { applyMe(user); });
  socket.on("team", function (t) { team = t || []; render(); });
  socket.on("state", function (s) {
    state.boards = s.boards || [];
    state.groups = s.groups || [];
    state.items = s.items || [];
    state.messages = s.messages || [];
    if (selectedBoardId !== "__all__" && !state.boards.some(function (b) { return b.id === selectedBoardId; })) selectedBoardId = "__all__";
    render();
  });

  // Close any open popover when clicking elsewhere. Checking for any live
  // .floating-popover directly (rather than only specific state flags) makes
  // this catch every popover, including ones like the recipient picker that
  // aren't tied to one of the flags below.
  document.addEventListener("click", function () {
    var changed = Object.keys(openAssigneePickers).length || Object.keys(openBoardAccess).length || Object.keys(openStepMenus).length || Object.keys(openBoardMenus).length || Object.keys(openStepRowMenus).length || Object.keys(openMessagePopovers).length || openNewBoardForm || document.querySelectorAll(".floating-popover").length;
    if (changed) {
      openAssigneePickers = {}; openBoardAccess = {}; openStepMenus = {}; openBoardMenus = {}; openStepRowMenus = {}; openMessagePopovers = {}; openNewBoardForm = false;
      render();
    }
  });

  // The right-side panel follows whatever was last clicked instead of requiring
  // an explicit "back to board chat" button: opening a task shows its panel (see
  // the row click handler), and clicking anything that isn't part of a task row,
  // the panel itself, or an open popover falls back to board chat automatically.
  document.addEventListener("click", function (e) {
    if (!selectedItemId) return;
    if (e.target.closest(".item, .board-chat, .floating-popover")) return;
    selectedItemId = null;
    render();
  });

  function addItem(groupId, title, order) { socket.emit("addItem", { groupId: groupId, title: title, order: order }); }
  function updateItem(id, patch) { socket.emit("updateItem", { id: id, patch: patch }); }
  function deleteItem(id) {
    if (window.confirm("Delete this task? This can't be undone.")) socket.emit("deleteItem", { id: id });
  }
  function updateGroup(id, patch) { socket.emit("updateGroup", { id: id, patch: patch }); }
  function deleteGroup(id) {
    var count = state.items.filter(function (i) { return i.groupId === id; }).length;
    if (count > 0) { window.alert("This group still has " + count + " task" + (count === 1 ? "" : "s") + " in it. Remove or move them first."); return; }
    if (window.confirm("Delete this empty group? This can't be undone.")) socket.emit("deleteGroup", { id: id });
  }

  render();
})();
</script>
