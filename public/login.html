<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A142B">
<title>Sign in · Avenium Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Same sign-in look as the Avenium investor portal: navy chevron background,
     the light Avenium logo with its shine, and the soft blue card. */
  :root { --navy: #0A142B; --green: #70B894; --ink-500: #5C6E76; --danger: #8C2F2F; --danger-100: #F1DEDC; --teal-100: #DCE7E3; --teal-600: #2F5D55; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--navy); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; background: var(--navy); }
  .wrap { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom));
    background: var(--navy) url('/assets/login-bg.jpg') center center / cover no-repeat; }
  .page-brand { flex: 1 1 0%; width: 100%; max-width: 900px; padding: 0 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; gap: 14px; }
  .shine { position: relative; display: block; width: 100%; aspect-ratio: 366.08 / 69.84; }
  .shine img { width: 100%; height: 100%; display: block; }
  .shine::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.9) 48%, rgba(255,255,255,.9) 52%, transparent 65%);
    background-size: 250% 100%; background-repeat: no-repeat; background-position: 120% 0;
    -webkit-mask: url('/assets/logo-mono.svg') center / contain no-repeat; mask: url('/assets/logo-mono.svg') center / contain no-repeat;
    animation: shine 3s ease-in-out infinite; }
  @keyframes shine { 0% { background-position: 115% 0; } 100% { background-position: -15% 0; } }
  @media (prefers-reduced-motion: reduce) { .shine::after { animation: none; display: none; } }
  /* the product name, under the wordmark */
  .product { color: #C9D2E3; font-size: clamp(13px, 2.2vw, 22px); font-weight: 500; letter-spacing: .32em; text-transform: uppercase; text-align: center; padding-left: .32em; }
  .spacer { flex: 1 1 0%; min-height: 0; }
  .card { width: 100%; max-width: 390px; background: #BECBE9; border-radius: 5px; box-shadow: 0 12px 40px rgba(17,32,44,.28); padding: 30px; }
  .row { margin-bottom: 12px; }
  .row input { width: 100%; padding: 10px 12px; font-family: inherit; font-size: 14px; color: var(--navy); background: #fff; border: 1px solid #D0D5E1; border-radius: 3px; outline: none; }
  .row input:focus { border-color: var(--navy); }
  .row input::placeholder { color: var(--ink-500); opacity: .75; }
  .btn { width: 100%; display: flex; justify-content: center; align-items: center; padding: 10px 14px; font-family: inherit; font-size: 14px; font-weight: 600; color: #fff; background: var(--navy); border: none; border-radius: 3px; cursor: pointer; }
  .btn:hover { background: #182643; }
  .btn:disabled { opacity: .7; cursor: default; }
  .foot { margin-top: 12px; font-size: 13px; text-align: center; }
  .foot a { color: var(--navy); text-decoration: none; font-weight: 500; }
  .foot a:hover { text-decoration: underline; }
  .msg { display: none; border-radius: 3px; padding: 8px 11px; font-size: 12.5px; margin-bottom: 12px; }
  .msg.show { display: block; }
  .msg.error { background: var(--danger-100); color: var(--danger); }
  .msg.note { background: var(--teal-100); color: var(--teal-600); }
  @media (max-width: 760px) {
    .wrap { padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    .card { padding: 22px; }
    .page-brand { max-width: 280px; }
    .spacer { flex: 0 0 12px; }
  }
  @media (max-width: 480px) { .page-brand { max-width: 220px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-brand">
    <div class="shine"><img src="/assets/logo-mono.svg" alt="Avenium"></div>
    <div class="product">Workspace</div>
  </div>
  <form class="card" id="loginForm" autocomplete="on">
    <div class="msg error" id="errorBox"></div>
    <div class="msg note" id="noteBox"></div>
    <div class="row"><input id="username" name="username" type="text" placeholder="Email or username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></div>
    <div class="row"><input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required></div>
    <button class="btn" id="submitBtn" type="submit">Sign in</button>
    <div class="foot"><a href="#" id="forgot">Forgot password</a></div>
  </form>
  <div class="spacer"></div>
</div>

<script>
  var form = document.getElementById("loginForm");
  var errorBox = document.getElementById("errorBox");
  var noteBox = document.getElementById("noteBox");
  var submitBtn = document.getElementById("submitBtn");

  document.getElementById("forgot").addEventListener("click", function (e) {
    e.preventDefault();
    errorBox.classList.remove("show");
    noteBox.textContent = "Ask an Avenium admin to reset your password. They can do it from Admin › Users.";
    noteBox.classList.add("show");
  });

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errorBox.classList.remove("show"); noteBox.classList.remove("show");
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in…";
    try {
      var res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value
        })
      });
      if (res.ok) {
        // back to the page that sent you here, if any (only pages on this site)
        var next = new URLSearchParams(location.search).get("next");
        window.location.href = next && next.charAt(0) === "/" && next.charAt(1) !== "/" ? next : "/";
        return;
      }
      var data = await res.json().catch(function () { return {}; });
      errorBox.textContent = data.error === "invalid_credentials"
        ? "That email, username or password isn't right."
        : "Couldn't sign in. Please try again.";
      errorBox.classList.add("show");
    } catch (err) {
      errorBox.textContent = "Couldn't reach the server. Please try again.";
      errorBox.classList.add("show");
    }
    submitBtn.disabled = false;
    submitBtn.textContent = "Sign in";
  });
</script>
</body>
</html>
